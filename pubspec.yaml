name: budget_buddy
description: "A personal finance management app to track income, expenses, and budgets with visual charts and analytics."

publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cloud_firestore: ^6.2.0
  firebase_auth: ^6.4.0
  firebase_core: ^4.6.0
  fl_chart: ^1.2.0
  image_picker: ^1.2.1
  firebase_storage: ^13.3.0
  google_sign_in: ^7.2.0
  cloudinary_public: ^0.23.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  smooth_page_indicator: ^1.1.0
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.1
  tutorial_coach_mark: ^1.3.3
  liquid_glass_bar: ^0.1.0
  liquid_glass_renderer: ^0.2.0-dev.4
  flutter_debouncer: ^2.1.1
  flutter_dotenv: ^6.0.1
  package_info_plus: ^10.1.0



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0



flutter:
  uses-material-design: true

  assets:
    - .env
    - images/start.png
    - images/nobg.png
    - images/intro1.png
    - images/intro2.png
    - images/intro3.png
    - images/noback.png
    - images/google-logo.webp
    - images/playstore.png
